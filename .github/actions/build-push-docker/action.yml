name: 'Build Web Server Docker'
description: 'Build Docker Images'
inputs:
  dockerfile:
    description: Where is the Dockerfile?
    default: 'Dockerfile'
  image:
    description: Image name, default "alphesdk-registry"
    default: alphesdk-registry
  username:
    description: repository_owner?
    required: true
  password:
    description: 'Docker repo password'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Get Version Number
      id: get_version_step
      shell: bash
      run: |
        echo "version=$(grep -o '"version": *"[^"]*"' package.json | cut -d '"' -f 4)" >> $GITHUB_OUTPUT
        echo "prerelease=$(grep -o '"version": *"[^"]*"' package.json | cut -d '"' -f 4 | cut -d '.' -f 3 | cut -d '-' -f 2)"  >> $GITHUB_OUTPUT
        echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    # ${{ steps.commit_message_step.outputs.version }}
    - name: Build and push alphesdk-registry docker
      uses: docker/build-push-action@v5
      with:
        file: ${{ inputs.dockerfile }}
        context: .
        push: true
        # Tags, :latest,  :latest-alpha,  :0.5.3-alpha.1
        tags: ghcr.io/${{ steps.get_version_step.outputs.owner }}/${{ inputs.image }}:latest,ghcr.io/${{ steps.get_version_step.outputs.owner }}/${{ inputs.image }}:latest-${{ steps.get_version_step.outputs.prerelease }},ghcr.io/${{ steps.get_version_step.outputs.owner }}/${{ inputs.image }}:${{ steps.get_version_step.outputs.version }}
        # cache-from: type=gha
        # cache-to: type=gha,mode=max
